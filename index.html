<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="format-detection" content="telephone=no" />

    <!-- 首帧主题：避免暗色偏好用户看到白屏闪烁 -->
    <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', t === 'dark' ? '#0A0A0A' : '#FFFFFF');
      } catch (e) {}
    })();
    </script>

    <!-- 以下 SEO 标签（title / description / OG / Twitter / JSON-LD / canonical）
         由 vite 插件根据 src/config.js 自动注入，无需手动维护 -->
    <title>个人主页</title>
    <meta name="description" content="个人主页" />

    <!-- Google Fonts: Onest + Noto Sans SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800;900&family=Onest:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- 站点图标：使用头像图片 -->
    <link rel="icon" type="image/png" href="./favicon-64.png" />
    <link rel="apple-touch-icon" type="image/png" href="./favicon-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
